<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library & Favorites — Doujin Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/doujinPage/css/base.css">
  <link rel="stylesheet" href="/doujinPage/css/favorite.css">
</head>
<body>

  <!-- Navbar (Sama seperti halaman lain) -->
<div class="nav-container">
      <div class="brand">
        <a href="/doujinPage/html/index.html">
          <h1>Doujin Library</h1>
        </a>
      </div>

      <nav class="nav-links" id="navLinks">
        <a href="/nekoPage/html/">NEKO VIDEO</a>
        <a href="/doujinPage/html/index.html">HOME</a>
        <a href="/doujinPage/html/allManga.html">ALL</a>
        <a href="/doujinPage/html/categories.html">CATEGORIES</a>
        <a href="/doujinPage/html/favorite.html"  class="active">LIBRARY</a>
        <a href="/doujinPage/html/account.html">ACCOUNT</a>
      </nav>
    </div>
  </header>

  <main class="library-container">
    <h1 class="library-title">My Library</h1>

    <!-- SECTION: FAVORITE MANGA -->
    <section class="library-section">
      <div class="section-header">
        <h2>❤️ Favorite Manga</h2>
      </div>
      <div class="manga-grid" id="favoriteGrid">
        <!-- Card akan di-generate via JS -->
      </div>
      <div class="empty-state" id="favoriteEmpty" style="display: none;">Belum ada manga yang ditambahkan ke Favorite.</div>
      <button class="see-more-btn" id="favoriteSeeMore" style="display: none;">SEE MORE ▾</button>
    </section>

    <!-- SECTION: BOOKMARK MANGA -->
    <section class="library-section">
      <div class="section-header">
        <h2>🔖 Bookmarked Manga</h2>
      </div>
      <div class="manga-grid" id="bookmarkGrid">
        <!-- Card akan di-generate via JS -->
      </div>
      <div class="empty-state" id="bookmarkEmpty" style="display: none;">Belum ada manga yang di-bookmark.</div>
      <button class="see-more-btn" id="bookmarkSeeMore" style="display: none;">SEE MORE ▾</button>
    </section>
  </main>

  <script src="../js/favorite.js"></script>
</body>
</html>
