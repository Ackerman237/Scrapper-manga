<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doujin Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/doujinPage/css/base.css">
  <link rel="stylesheet" href="/doujinPage/css/components.css">
  <link rel="stylesheet" href="/doujinPage/css/cards.css">
  <link rel="stylesheet" href="/doujinPage/css/allManga.css">
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header>
    <div class="nav-container">
      <div class="brand">
        <a href="/doujinPage/html/index.html">
          <h1>Doujin Library</h1>
        </a>
      </div>

      <nav class="nav-links" id="navLinks">
        <a href="/nekoPage/html/">NEKO VIDEO</a>
        <a href="/doujinPage/html/index.html">HOME</a>
        <a href="/doujinPage/html/allManga.html" class="active">ALL</a>
        <a href="/doujinPage/html/categories.html">CATEGORIES</a>
        <a href="/doujinPage/html/library.html">LIBRARY</a>
        <a href="/doujinPage/html/account.html">ACCOUNT</a>
      </nav>

      <form id="searchForm" class="search-box">
        <input type="text" id="searchInput" placeholder="Cari judul komik...">
        <button type="submit">CARI</button>
      </form>

      <button class="nav-hamburger" id="navHamburger" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>

    <section class="manga-section">
      <div class="toolbar">
        <h2 id="sectionTitle" class="section-title">ALL Series</h2>

        <div class="toolbar-controls">
          <div class="filter-group">
            <label for="genreSelect" class="filter-label">GENRE</label>
            <select id="genreSelect" class="filter-select">
              <option value="">Semua Genre</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="statusSelect" class="filter-label">STATUS</label>
            <select id="statusSelect" class="filter-select">
              <option value="">Semua Status</option>
              <option value="ongoing">Ongoing</option>
              <option value="completed">Completed</option>
              <option value="hiatus">Hiatus</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="typeSelect" class="filter-label">TIPE</label>
            <select id="typeSelect" class="filter-select">
              <option value="">Semua Tipe</option>
              <option value="manga">Manga</option>
              <option value="manhwa">Manhwa</option>
              <option value="manhua">Manhua</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="sortSelect" class="filter-label">URUTKAN</label>
            <select id="sortSelect" class="filter-select">
              <option value="newest">Terbaru</option>
              <option value="rating">Rating</option>
              <option value="title">Judul A-Z</option>
            </select>
          </div>
        </div>
      </div>

      <div id="mangaGrid" class="manga-grid">
        <p class="loading">Memuat manga...</p>
      </div>

      <div class="pagination">
        <button id="prevBtn" class="pagination-btn" type="button">← PREVIOUS</button>
        <div id="pageNumbers" class="page-numbers" aria-label="Pagination"></div>
        <button id="nextBtn" class="pagination-btn" type="button">NEXT →</button>
      </div>
    </section>

  </main>

  <button id="backToTop" class="back-to-top" title="Kembali ke atas">▲</button>

  <script src="/doujinPage/shared/nav.js" defer></script>
  <script src="/doujinPage/shared/api.js" defer></script>
  <script src="/doujinPage/shared/ui.js" defer></script>
  <script src="/doujinPage/shared/storage.js" defer></script>
  <script src="/doujinPage/js/allManga.js" defer></script>
</body>
</html>
