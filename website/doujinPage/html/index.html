<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doujin Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/doujinPage/css/base.css?v=3">
  <link rel="stylesheet" href="/doujinPage/css/components.css?v=3">
  <link rel="stylesheet" href="/doujinPage/css/cards.css?v=3">
  <link rel="stylesheet" href="/doujinPage/css/index.css?v=3">
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header>
    <div class="nav-container">
      <div class="brand">
        <a href="/doujinPage/html/index.html">
          <h1>Doujin Library</h1>
        </a>
      </div>

      <nav class="nav-links" id="navLinks">
        <a href="/nekoPage/html/">NEKO VIDEO</a>
        <a href="/doujinPage/html/index.html" class="active">HOME</a>
        <a href="/doujinPage/html/allManga.html">ALL</a>
        <a href="/doujinPage/html/categories.html">CATEGORIES</a>
        <a href="/doujinPage/html/library.html">LIBRARY</a>
        <a href="/doujinPage/html/account.html">ACCOUNT</a>
      </nav>

      <form id="searchForm" class="search-box">
        <input type="text" id="searchInput" placeholder="Cari judul komik...">
        <button type="submit">CARI</button>
      </form>

      <button class="nav-hamburger" id="navHamburger" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>

    <!-- HERO BANNER SECTION -->
    <section class="hero-section">
      <div class="hero-banner" style="background-image: linear-gradient(to top, rgba(21,18,15,0.9), transparent), url('https://placehold.co/1200x400/201b16/ece6dc?text=Featured+Manga');">
        <div class="hero-tags">
          <span class="badge badge-ink">MANHWA</span>
          <span class="badge badge-gold"><svg class="ic" aria-hidden="true"><use href="/doujinPage/icons.svg#i-star"></use></svg> 8.8</span>
        </div>
        <h2 class="hero-title">I BANGED ALL MY CLASSMATES AFTER GRADUATION</h2>
        <div class="hero-actions">
          <button class="btn btn-primary">READ NOW</button>
          <button class="btn btn-icon">INFO</button>
        </div>
      </div>

      <aside class="blog-sidebar">
        <h3>My History</h3>
        <div class="history-carousel-wrapper" id="historyWrapper">
          <div class="history-carousel-track" id="historyContainer">
            <p class="error" style="font-size: 13px; color: var(--text-muted, #888);">Belum ada riwayat membaca.</p>
          </div>
        </div>
      </aside>
    </section>

    <!-- POPULAR SECTION -->
    <section class="manga-section popular-section">
      <h2 class="section-title"><svg class="ic" aria-hidden="true"><use href="/doujinPage/icons.svg#i-flame"></use></svg> Populer Saat Ini</h2>
      <div id="popularGrid" class="popular-row">
        <p class="loading">Memuat manga populer...</p>
      </div>
      <div class="load-more-container">
        <a href="/doujinPage/html/allManga.html?sort=rating" class="btn-see-more">
          LIHAT SEMUA POPULER <svg class="ic" aria-hidden="true"><use href="/doujinPage/icons.svg#i-arrow-right"></use></svg>
        </a>
      </div>
    </section>

    <!-- MANGA LIST SECTION -->
    <section class="manga-section">
      <h2 id="sectionTitle" class="section-title">Update Terbaru</h2>

      <div id="mangaGrid" class="manga-grid">
        <p class="loading">Memuat manga...</p>
      </div>

      <div class="load-more-container">
        <a href="/doujinPage/html/allManga.html" class="btn-see-more">
          VIEW ALL MANGA <svg class="ic" aria-hidden="true"><use href="/doujinPage/icons.svg#i-arrow-right"></use></svg>
        </a>
      </div>
    </section>

  </main>

  <button id="backToTop" class="back-to-top" title="Kembali ke atas"><svg class="ic" aria-hidden="true"><use href="/doujinPage/icons.svg#i-arrow-up"></use></svg></button>

  <script src="/doujinPage/shared/nav.js?v=3" defer></script>
  <script src="/doujinPage/shared/api.js?v=3" defer></script>
  <script src="/doujinPage/shared/ui.js?v=3" defer></script>
  <script src="/doujinPage/shared/storage.js?v=3" defer></script>
  <script src="/doujinPage/js/index.js?v=3" defer></script>
</body>
</html>
