<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader — Doujin Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- HEADER / NAVBAR (sama seperti index.html & detail.html) -->
  <header>
    <div class="nav-container">
      <div class="brand">
        <a href="/">
          <h1>Doujin Library</h1>
        </a>
      </div>

      <nav class="nav-links">
        <a href="/">HOME</a>
        <a href="#">ALL</a>
        <a href="#">CATEGORIES</a>
        <a href="#">BLOG</a>
        <a href="#">LEADERBOARD</a>
        <a href="#">VIP</a>
      </nav>

      <form id="searchForm" class="search-box">
        <input type="text" id="searchInput" placeholder="Cari manga...">
        <button type="submit">CARI</button>
      </form>
    </div>
  </header>

  <main class="container">

    <div id="info">
      <p class="loading">Memuat chapter...</p>
    </div>

    <div id="reader" class="reader"></div>

  </main>

  <button id="backToTop" class="back-to-top" title="Kembali ke atas">▲</button>

  <script src="/js/reader.js" defer></script>

</body>
</html>
