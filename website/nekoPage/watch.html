<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video - Neko</title>
  <link rel="stylesheet" href="/nekoPage/style.css">
  <style>
    .player-container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2d261e;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-details {
      margin-top: 20px;
      background: #1a1612;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #2d261e;
    }
    .video-title-main {
      font-size: 1.3rem;
      color: #ece6dc;
      margin-bottom: 10px;
    }
    .synopsis-text {
      color: #b0a89e;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .nav-header {
      padding: 15px 20px;
      background: #120e0b;
      border-bottom: 1px solid #2d261e;
      display: flex;
      gap: 15px;
    }
    .nav-header a {
      color: #ece6dc;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-header a:hover {
      color: #d32f2f;
    }
    .play-btn-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #120e0b;
    }
    .play-btn {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background-color: #d32f2f;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .play-btn:hover {
      background-color: #b71c1c;
    }
  </style>
</head>
<body>

  <div class="nav-header">
    <a href="/nekoPage/index.html">← Kembali ke Neko List</a>
    <a href="/doujinPage/index.html">Ke Doujin Manga</a>
  </div>

  <main class="player-container">
    <div class="video-wrapper" id="playerBox">
      <p style="color:#ece6dc; text-align:center; padding-top:25%;">Memuat Player Video...</p>
    </div>

    <div class="video-details">
      <h2 id="videoTitle" class="video-title-main">Memuat Judul...</h2>
      <p id="videoSynopsis" class="synopsis-text"></p>
    </div>
  </main>

  <script>
    async function loadDetail() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      const playerBox = document.getElementById('playerBox');

      if (!slug) {
        playerBox.innerHTML = '<p style="color:#d32f2f; text-align:center; padding-top:25%;">Error: Parameter slug tidak ditemukan di URL.</p>';
        return;
      }

      try {
        const res = await fetch(`/api/neko/detail?slug=${encodeURIComponent(slug)}`);
        const result = await res.json();

        if (!result.success || !result.data) {
          throw new Error(result.message || 'Gagal memuat detail video.');
        }

        const detail = result.data;
        document.getElementById('videoTitle').innerText = detail.title || 'Tanpa Judul';
        document.getElementById('videoSynopsis').innerText = detail.synopsis || 'Tidak ada deskripsi/sinopsis.';

        if (detail.players && detail.players.length > 0) {
          const videoSource = detail.players[0];

          // Menggunakan sistem Click-to-Play untuk menghemat RAM & mencegah layar hitam saat awal muat
          playerBox.innerHTML = `
            <div class="play-btn-box" id="startPlayArea">
              <button class="play-btn" id="btnPlay">▶ Klik untuk Putar Video</button>
            </div>
          `;

          document.getElementById('btnPlay').onclick = function() {
          playerBox.innerHTML = `
            <iframe 
              src="${videoSource}" 
              sandbox="allow-scripts allow-same-origin allow-presentation"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
              style="width:100%; height:100%; border:0;"
            ></iframe>
          `;
        };
        } else {
          playerBox.innerHTML = '<p style="color:#d32f2f; text-align:center; padding-top:25%;">Player video tidak tersedia.</p>';
        }
      } catch (err) {
        playerBox.innerHTML = `<p style="color:#d32f2f; text-align:center; padding-top:25%;">Error: ${err.message}</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadDetail);
  </script>
</body>
</html>
